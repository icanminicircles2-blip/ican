<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN - Secure Login</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #4361ee; --success: #2ec4b6; --bg: #f8f9fa; --dark: #3f37c9; }
        body { font-family: sans-serif; background: var(--bg); direction: rtl; margin: 0; }
        #loginPage { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; background: linear-gradient(135deg, var(--dark), var(--primary)); color: white;
        }
        .login-card { 
            background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 85%; max-width: 350px; color: #333; text-align: center;
        }
        .login-card h2 { margin-bottom: 20px; color: var(--dark); }
        .header { background: var(--dark); color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .status-bar { background: #222; color: #00ff88; font-size: 11px; text-align: center; padding: 6px; position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-item { background: white; padding: 15px 5px; text-align: center; border-radius: 12px; border-bottom: 4px solid #ddd; cursor: pointer; font-weight: bold; font-size: 12px; }
        .btn-item svg { width: 24px; height: 24px; display: block; margin: 0 auto 8px; fill: #555; }
        .btn-item.active { background: #eef2ff; border-bottom-color: var(--primary); color: var(--primary); }
        .btn-item.active svg { fill: var(--primary); }
        .goal-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 6px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; margin-bottom: 10px; font-size: 16px; }
        .hidden { display: none; }
        svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-card">
        <div style="font-size: 50px; margin-bottom: 10px;">🛡️</div>
        <h2>مركز I CAN</h2>
        <p style="font-size: 13px; color: #666;">يرجى تسجيل الدخول</p>
        <input type="text" id="userIn" placeholder="اسم المستخدم">
        <input type="password" id="passIn" placeholder="كلمة المرور">
        <button class="btn-main" onclick="checkLogin()">دخول</button>
        <p id="loginError" style="color: red; font-size: 12px; display: none;">بيانات الدخول غير صحيحة</p>
    </div>
</div>

<div id="mainContent" class="hidden">
    <div id="status" class="status-bar">جاري المزامنة...</div>
    <div id="p1">
        <div class="header">
            <button onclick="logout()" style="background:none; border:1px solid white; color:white; border-radius:5px; padding:2px 10px; font-size:10px; cursor:pointer; float:left;">خروج</button>
            <h1>I CAN Center</h1>
            <p>مرحباً بك يا حسن ✅</p>
        </div>
        <div class="container">
            <input type="text" id="cIn" placeholder="اسم الطفل الجديد...">
            <button class="btn-main" onclick="addC()">إضافة طفل +</button>
            <div id="cList"></div>
        </div>
    </div>

    <div id="p2" class="hidden">
        <div class="header"><span onclick="goP('p1')" style="float:right; cursor:pointer; font-size:20px;">🔙</span><h2 id="cTitle"></h2></div>
        <div class="container"><div class="grid" id="mGrid"></div></div>
    </div>

    <div id="p3" class="hidden">
        <div class="header"><span onclick="goP('p2')" style="float:right; cursor:pointer; font-size:20px;">🔙</span><h2 id="mTitle"></h2></div>
        <div class="container">
            <div class="grid" id="dGrid"></div>
            <button class="btn-main" style="background:var(--success); margin-top:20px;" onclick="makeReport()">📄 تقرير الشهر</button>
            <div id="reportArea" class="hidden"></div>
        </div>
    </div>

    <div id="p4" class="hidden">
        <div class="header"><span onclick="goP('p3')" style="float:right; cursor:pointer; font-size:20px;">🔙</span><h2 id="dTitle"></h2></div>
        <div class="container">
            <input type="text" id="gIn" placeholder="اكتب الهدف...">
            <button class="btn-main" onclick="addG()">✅ حفظ الهدف</button>
            <div id="gList"></div>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC4hocSi-1d56msjMoBSGLkxAfV6DRRfcA",
        authDomain: "ican-center.firebaseapp.com",
        databaseURL: "https://ican-center-default-rtdb.firebaseio.com", 
        projectId: "ican-center",
        storageBucket: "ican-center.firebasestorage.app",
        messagingSenderId: "680182264820",
        appId: "1:680182264820:web:0fe442a3baae4811517fa1"
    };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('ican_global_sync');

    let db = [];
    let curC, curM, curD;
    const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    const domains = ["تخاطب", "تنمية مهارات", "رعاية ذاتية", "وظيفي", "حركي", "أكاديمي", "اجتماعي", "سلوكي", "نمائي", "حسي"];

    function checkLogin() {
        const u = document.getElementById('userIn').value;
        const p = document.getElementById('passIn').value;
        if(u === 'hassan' && p === '1234') { 
            localStorage.setItem('ican_auth', 'true');
            showMain();
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function showMain() {
        document.getElementById('loginPage').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        initSync();
    }

    function logout() {
        localStorage.removeItem('ican_auth');
        location.reload();
    }

    window.onload = () => {
        if(localStorage.getItem('ican_auth') === 'true') {
            showMain();
        }
    };

    function initSync() {
        dbRef.on('value', (snap) => {
            db = snap.val() || [];
            document.getElementById('status').innerText = "☁️ متصل (مرحبا حسن)";
            renderC();
            if (curC !== undefined) {
                if (!document.getElementById('p3').classList.contains('hidden')) renderD();
                if (!document.getElementById('p4').classList.contains('hidden')) renderG();
            }
        });
    }

    function save() { dbRef.set(db); }
    function addC() {
        let n = document.getElementById('cIn').value.trim();
        if(n) { db.push({name:n, data:{}}); save(); document.getElementById('cIn').value=''; }
    }
    function renderC() {
        document.getElementById('cList').innerHTML = db.map((c,i)=>`
            <div class="card" onclick="openM(${i})">
                <span>👤 ${c.name}</span>
                <button onclick="event.stopPropagation();delC(${i})" style="border:none;background:none;color:red;cursor:pointer;">🗑️</button>
            </div>
        `).join('');
    }
    function delC(i) { if(confirm('حذف؟')){ db.splice(i,1); save(); } }
    function openM(i) {
        curC=i; document.getElementById('cTitle').innerText = db[i].name;
        document.getElementById('mGrid').innerHTML = months.map(m=>`<div class="btn-item" onclick="openD('${m}')">📅<br>${m}</div>`).join('');
        goP('p2');
    }
    function openD(m) {
        curM=m; document.getElementById('mTitle').innerText = "شهر " + m;
        renderD(); goP('p3');
    }
    function renderD() {
        document.getElementById('dGrid').innerHTML = domains.map(d => {
            let active = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][d] && db[curC].data[curM][d].length > 0);
            return `<div class="btn-item ${active?'active':''}" onclick="openG('${d}')">📂<br>${d}</div>`;
        }).join('');
    }
    function openG(d) {
        curD=d; document.getElementById('dTitle').innerText = d;
        renderG(); goP('p4');
    }
    function addG() {
        let txt = document.getElementById('gIn').value.trim();
        if(!txt) return;
        if(!db[curC].data) db[curC].data = {};
        if(!db[curC].data[curM]) db[curC].data[curM] = {};
        if(!db[curC].data[curM][curD]) db[curC].data[curM][curD] = [];
        db[curC].data[curM][curD].push({txt:txt, help:'', prog:'0', gen:''});
        save(); document.getElementById('gIn').value = ''; renderG();
    }
    function renderG() {
        let goals = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][curD]) ? db[curC].data[curM][curD] : [];
        document.getElementById('gList').innerHTML = goals.map((g,i)=>`
            <div class="goal-box">
                <div style="display:flex;justify-content:space-between;"><b>${g.txt}</b><button onclick="delG(${i})" style="border:none;background:none;color:red;cursor:pointer;">🗑️</button></div>
                <div style="display:flex;gap:5px;margin-top:10px;">
                    <select onchange="updG(${i},'help',this.value)"><option value="">🆘 مساعدة</option>${["FP","PP","FV","PV","M","G","P","V"].map(h=>`<option value="${h}" ${g.help==h?'selected':''}>${h}</option>`).join('')}</select>
                    <select onchange="updG(${i},'prog',this.value)"><option value="">📈 إنجاز</option>${[0,25,50,75,100].map(p=>`<option value="${p}" ${g.prog==p?'selected':''}>${p}%</option>`).join('')}</select>
                    <select onchange="updG(${i},'gen',this.value)"><option value="">🌍 تعميم</option><option value="نعم" ${g.gen=='نعم'?'selected':''}>نعم</option><option value="لا" ${g.gen=='لا'?'selected':''}>لا</option></select>
                </div>
            </div>`).join('');
    }
    function updG(i,f,v) { db[curC].data[curM][curD][i][f]=v; save(); }
    function delG(i) { if(confirm('حذف؟')){ db[curC].data[curM][curD].splice(i,1); save(); renderG(); }}
    function makeReport() {
        let child = db[curC]; let mData = child.data ? child.data[curM] : null;
        if(!mData) return alert("لا توجد بيانات.");
        let html = `<h3>تقرير: ${child.name}</h3><table border="1" style="width:100%; border-collapse:collapse;"><tr><th>المجال</th><th>الهدف</th><th>إنجاز</th></tr>`;
        for(let d in mData) { mData[d].forEach(g => { html += `<tr><td>${d}</td><td>${g.txt}</td><td>${g.prog}%</td></tr>`; }); }
        document.getElementById('reportArea').innerHTML = html + `</table><button onclick="window.print()" style="margin-top:10px; width:100%; padding:10px;">طباعة</button>`;
        document.getElementById('reportArea').classList.remove('hidden');
    }
    function goP(id) {
        document.querySelectorAll('#mainContent > div:not(.status-bar)').forEach(p=>p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
