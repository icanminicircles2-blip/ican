<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN - ICON VERSION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #4361ee; --success: #2ec4b6; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; margin: 0; }
        .header { background: linear-gradient(135deg, #3f37c9, #4361ee); color: white; padding: 25px; text-align: center; border-radius: 0 0 25px 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .status-bar { background: #222; color: #00ff88; font-size: 12px; text-align: center; padding: 8px; position: sticky; top: 0; z-index: 1000; font-weight: bold; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 18px; border-radius: 15px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; transition: 0.3s; }
        .card:active { transform: scale(0.98); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .btn-item { background: white; padding: 20px 5px; text-align: center; border-radius: 15px; border-bottom: 4px solid #ddd; cursor: pointer; font-weight: bold; transition: 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .btn-item i { font-size: 24px; margin-bottom: 8px; display: block; color: #555; }
        .btn-item.active { background: #eef2ff; border-bottom-color: var(--primary); color: var(--primary); }
        .btn-item.active i { color: var(--primary); }
        .goal-box { background: white; padding: 15px; border-radius: 15px; margin-bottom: 12px; border-right: 6px solid var(--primary); box-shadow: 0 3px 10px rgba(0,0,0,0.05); }
        .hidden { display: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #ddd; box-sizing: border-box; margin-bottom: 15px; font-size: 16px; outline: none; text-align: right; }
        .back-btn { float: left; color: white; background: rgba(255,255,255,0.2); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-size: 14px; }
        select { padding: 10px; border-radius: 8px; border: 1px solid #eee; flex: 1; font-size: 12px; background: #f9f9f9; }
        .del-btn { color: #ff4d4d; border: none; background: none; font-size: 20px; cursor: pointer; padding: 5px; }
    </style>
</head>
<body>

<div id="status" class="status-bar"><i class="fas fa-wifi"></i> جاري المزامنة...</div>

<div id="p1">
    <div class="header"><h1>I CAN Center <i class="fas fa-user-graduate"></i></h1><p>نظام المتابعة الذكي</p></div>
    <div class="container">
        <input type="text" id="cIn" placeholder="اسم الطفل الجديد...">
        <button class="btn-main" onclick="addC()"><i class="fas fa-plus-circle"></i> إضافة طفل جديد</button>
        <div id="cList"></div>
    </div>
</div>

<div id="p2" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p1')"><i class="fas fa-arrow-right"></i> رجوع</span><h2 id="cTitle"></h2></div>
    <div class="container"><div class="grid" id="mGrid"></div></div>
</div>

<div id="p3" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p2')"><i class="fas fa-arrow-right"></i> رجوع</span><h2 id="mTitle"></h2></div>
    <div class="container">
        <div class="grid" id="dGrid"></div>
        <button class="btn-main" style="background:var(--success); margin-top:25px;" onclick="makeReport()"><i class="fas fa-file-alt"></i> استخراج التقرير</button>
        <div id="reportArea" class="hidden"></div>
    </div>
</div>

<div id="p4" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p3')"><i class="fas fa-arrow-right"></i> رجوع</span><h2 id="dTitle"></h2></div>
    <div class="container">
        <input type="text" id="gIn" placeholder="اكتب الهدف الجديد...">
        <button class="btn-main" onclick="addG()"><i class="fas fa-check-circle"></i> حفظ الهدف فوراً</button>
        <div id="gList"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC4hocSi-1d56msjMoBSGLkxAfV6DRRfcA",
        authDomain: "ican-center.firebaseapp.com",
        databaseURL: "https://ican-center-default-rtdb.firebaseio.com", 
        projectId: "ican-center",
        storageBucket: "ican-center.firebasestorage.app",
        messagingSenderId: "680182264820",
        appId: "1:680182264820:web:0fe442a3baae4811517fa1"
    };

    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('ican_v7_icons');

    let db = [];
    let curC, curM, curD;
    const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    const domains = ["تخاطب", "تنمية مهارات", "رعاية ذاتية", "وظيفي", "حركي", "أكاديمي", "اجتماعي", "سلوكي", "نمائي", "حسي"];

    dbRef.on('value', (snap) => {
        db = snap.val() || [];
        document.getElementById('status').innerHTML = '<i class="fas fa-check-double"></i> متصل بالسحابة';
        renderC();
        if (curC !== undefined) {
            if (!document.getElementById('p3').classList.contains('hidden')) renderD();
            if (!document.getElementById('p4').classList.contains('hidden')) renderG();
        }
    });

    function save() { dbRef.set(db); }

    function addC() {
        let n = document.getElementById('cIn').value.trim();
        if(n) { db.push({name:n, data:{}}); save(); document.getElementById('cIn').value=''; }
    }

    function renderC() {
        document.getElementById('cList').innerHTML = db.map((c,i)=>`
            <div class="card" onclick="openM(${i})">
                <span><i class="fas fa-user-circle" style="color:var(--primary)"></i> ${c.name}</span>
                <button class="del-btn" onclick="event.stopPropagation();delC(${i})"><i class="fas fa-trash-alt"></i></button>
            </div>
        `).join('');
    }

    function delC(i) { if(confirm('حذف؟')){ db.splice(i,1); save(); } }

    function openM(i) {
        curC=i; document.getElementById('cTitle').innerText = "👤 " + db[i].name;
        document.getElementById('mGrid').innerHTML = months.map(m=>`<div class="btn-item" onclick="openD('${m}')"><i class="fas fa-calendar-alt"></i>${m}</div>`).join('');
        goP('p2');
    }

    function openD(m) {
        curM=m; document.getElementById('mTitle').innerText = "📅 شهر " + m;
        renderD();
        document.getElementById('reportArea').classList.add('hidden');
        goP('p3');
    }

    function renderD() {
        document.getElementById('dGrid').innerHTML = domains.map(d => {
            let active = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][d] && db[curC].data[curM][d].length > 0);
            return `<div class="btn-item ${active?'active':''}" onclick="openG('${d}')"><i class="fas fa-folder-open"></i>${d}</div>`;
        }).join('');
    }

    function openG(d) {
        curD=d; document.getElementById('dTitle').innerText = "📂 مجال: " + d;
        renderG();
        goP('p4');
    }

    function addG() {
        let txt = document.getElementById('gIn').value.trim();
        if(!txt) return;
        if(!db[curC].data) db[curC].data = {};
        if(!db[curC].data[curM]) db[curC].data[curM] = {};
        if(!db[curC].data[curM][curD]) db[curC].data[curM][curD] = [];
        
        db[curC].data[curM][curD].push({txt:txt, help:'', prog:'0', gen:''});
        save();
        document.getElementById('gIn').value = '';
        renderG(); 
    }

    function renderG() {
        let goals = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][curD]) ? db[curC].data[curM][curD] : [];
        document.getElementById('gList').innerHTML = goals.map((g,i)=>`
            <div class="goal-box">
                <div style="display:flex;justify-content:space-between;align-items:center;">
                    <b style="color:#333;"><i class="fas fa-bullseye" style="color:var(--primary)"></i> ${g.txt}</b>
                    <button class="del-btn" onclick="delG(${i})" style="font-size:16px;"><i class="fas fa-times-circle"></i></button>
                </div>
                <div style="display:flex;gap:8px;margin-top:12px;">
                    <select onchange="updG(${i},'help',this.value)"><option value="">🆘 مساعدة</option>${["FP","PP","FV","PV","M","G","P","V"].map(h=>`<option value="${h}" ${g.help==h?'selected':''}>${h}</option>`).join('')}</select>
                    <select onchange="updG(${i},'prog',this.value)"><option value="">📈 إنجاز</option>${[0,25,50,75,100].map(p=>`<option value="${p}" ${g.prog==p?'selected':''}>${p}%</option>`).join('')}</select>
                    <select onchange="updG(${i},'gen',this.value)"><option value="">🌍 تعميم</option><option value="نعم" ${g.gen=='نعم'?'selected':''}>نعم</option><option value="لا" ${g.gen=='لا'?'selected':''}>لا</option></select>
                </div>
            </div>`).join('');
    }

    function updG(i,f,v) { db[curC].data[curM][curD][i][f]=v; save(); }
    function delG(i) { if(confirm('حذف؟')){ db[curC].data[curM][curD].splice(i,1); save(); renderG(); }}

    function makeReport() {
        let child = db[curC]; let mData = child.data ? child.data[curM] : null;
        if(!mData) return alert("لا يوجد أهداف.");
        let html = `<div style="text-align:center; padding:15px; background:#fff; border:1px solid #ddd; border-radius:10px;"><h3>تقرير ${child.name}</h3><table border="1" style="width:100%; border-collapse:collapse; margin-top:10px;"><tr><th>المجال</th><th>الهدف</th><th>الإنجاز</th></tr>`;
        for(let d in mData) { mData[d].forEach(g => { html += `<tr><td>${d}</td><td>${g.txt}</td><td>${g.prog}%</td></tr>`; }); }
        document.getElementById('reportArea').innerHTML = html + `</table><button class="btn-main" style="margin-top:20px; background:#333;" onclick="window.print()">طباعة</button>`;
        document.getElementById('reportArea').classList.remove('hidden');
    }

    function goP(id) {
        document.querySelectorAll('body > div:not(.status-bar)').forEach(p=>p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
