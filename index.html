<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN - FINAL SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #4361ee; --secondary: #3f37c9; --success: #2ec4b6; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); direction: rtl; margin: 0; padding-bottom: 20px; }
        .header { background: linear-gradient(135deg, var(--secondary), var(--primary)); color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .status { background: #eee; font-size: 11px; text-align: center; padding: 4px; color: #666; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border: 1px solid #eee; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
        .btn-item { background: white; padding: 18px 5px; text-align: center; border-radius: 12px; border-bottom: 4px solid #ddd; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .btn-item.active { background: #eef2ff; border-bottom-color: var(--primary); color: var(--primary); box-shadow: 0 4px 8px rgba(67, 97, 238, 0.1); }
        .goal-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; border-right: 6px solid var(--primary); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .hidden { display: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 10px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; margin-bottom: 10px; outline: none; }
        .back-btn { float: left; color: white; background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        select { padding: 8px; border-radius: 6px; border: 1px solid #eee; flex: 1; font-size: 11px; background: #fbfbfb; }
        #reportArea { background: white; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #333; }
        @media print { body * { visibility: hidden; } #reportArea, #reportArea * { visibility: visible; } #reportArea { position: absolute; top: 0; width: 100%; } }
    </style>
</head>
<body>

<div class="status" id="st">جاري الاتصال...</div>

<div id="p1">
    <div class="header"><h1>I CAN Center</h1><p>المزامنة السحابية النشطة</p></div>
    <div class="container">
        <input type="text" id="cIn" placeholder="اسم الطفل الجديد...">
        <button class="btn-main" onclick="addC()">إضافة طفل +</button>
        <div id="cList"></div>
    </div>
</div>

<div id="p2" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p1')">رجوع</span><h2 id="cTitle"></h2></div>
    <div class="container"><div class="grid" id="mGrid"></div></div>
</div>

<div id="p3" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p2')">رجوع</span><h2 id="mTitle"></h2></div>
    <div class="container">
        <div class="grid" id="dGrid"></div>
        <button class="btn-main" style="background:var(--success); margin-top:20px;" onclick="makeReport()">📄 استخراج تقرير الشهر</button>
        <div id="reportArea" class="hidden"></div>
    </div>
</div>

<div id="p4" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p3')">رجوع</span><h2 id="dTitle"></h2></div>
    <div class="container">
        <input type="text" id="gIn" placeholder="اكتب الهدف هنا...">
        <button class="btn-main" onclick="addG()">حفظ الهدف</button>
        <div id="gList"></div>
    </div>
</div>

<script>
    // الإعدادات اللي بعتها
    const firebaseConfig = {
        apiKey: "AIzaSyC4hocSi-1d56msjMoBSGLkxAfV6DRRfcA",
        authDomain: "ican-center.firebaseapp.com",
        databaseURL: "https://ican-center-default-rtdb.firebaseio.com", 
        projectId: "ican-center",
        storageBucket: "ican-center.firebasestorage.app",
        messagingSenderId: "680182264820",
        appId: "1:680182264820:web:0fe442a3baae4811517fa1"
    };

    // تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('ican_v3');

    let db = [];
    let curC, curM, curD;
    const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    const domains = ["تخاطب", "تنمية مهارات", "رعاية ذاتية", "وظيفي", "حركي", "أكاديمي", "اجتماعي", "سلوكي", "نمائي", "حسي"];

    // المزامنة اللحظية
    dbRef.on('value', (snap) => {
        db = snap.val() || [];
        document.getElementById('st').innerText = "✅ متصل بالسحابة (برجاء التأكد من الـ Rules)";
        renderC();
        if(curC !== undefined && curM) { renderD(); if(curD) renderG(); }
    }, (e) => {
        document.getElementById('st').innerText = "❌ خطأ في الصلاحيات: اذهب لـ Rules واجعلها true";
    });

    function save() { dbRef.set(db); }

    function addC() {
        let n = document.getElementById('cIn').value.trim();
        if(n) { db.push({name:n, data:{}}); save(); document.getElementById('cIn').value=''; }
    }

    function renderC() {
        document.getElementById('cList').innerHTML = db.map((c,i)=>`
            <div class="card" onclick="openM(${i})"><span>👤 ${c.name}</span><button onclick="event.stopPropagation();delC(${i})" style="border:none;background:none;color:red;font-size:18px;">🗑️</button></div>
        `).join('');
    }

    function delC(i) { if(confirm('حذف الطفل؟')) { db.splice(i,1); save(); } }

    function openM(i) {
        curC = i; document.getElementById('cTitle').innerText = db[i].name;
        document.getElementById('mGrid').innerHTML = months.map(m => `<div class="btn-item" onclick="openD('${m}')">📅<br>${m}</div>`).join('');
        goP('p2');
    }

    function openD(m) {
        curM = m; document.getElementById('mTitle').innerText = "شهر " + m;
        document.getElementById('dGrid').innerHTML = domains.map(d => {
            let active = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][d] && db[curC].data[curM][d].length > 0);
            return `<div class="btn-item ${active?'active':''}" onclick="openG('${d}')">📁<br>${d}</div>`;
        }).join('');
        document.getElementById('reportArea').classList.add('hidden');
        goP('p3');
    }

    function openG(d) {
        curD = d; document.getElementById('dTitle').innerText = d;
        renderG(); goP('p4');
    }

    function addG() {
        let txt = document.getElementById('gIn').value.trim();
        if(!txt) return;
        if(!db[curC].data) db[curC].data = {};
        if(!db[curC].data[curM]) db[curC].data[curM] = {};
        if(!db[curC].data[curM][curD]) db[curC].data[curM][curD] = [];
        db[curC].data[curM][curD].push({txt:txt, help:'', prog:'', gen:''});
        save(); document.getElementById('gIn').value='';
    }

    function renderG() {
        let goals = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][curD]) ? db[curC].data[curM][curD] : [];
        document.getElementById('gList').innerHTML = goals.map((g,i)=>`
            <div class="goal-box">
                <div style="display:flex;justify-content:space-between"><b>${g.txt}</b><button onclick="delG(${i})" style="border:none;background:none;color:red">🗑️</button></div>
                <div style="display:flex;gap:5px;margin-top:10px;">
                    <select onchange="updG(${i},'help',this.value)"><option value="">مساعدة</option>${["FP","PP","FV","PV","M","G","P","V"].map(h=>`<option value="${h}" ${g.help==h?'selected':''}>${h}</option>`).join('')}</select>
                    <select onchange="updG(${i},'prog',this.value)"><option value="">إنجاز</option>${[0,25,50,75,100].map(p=>`<option value="${p}" ${g.prog==p?'selected':''}>${p}%</option>`).join('')}</select>
                    <select onchange="updG(${i},'gen',this.value)"><option value="">تعميم</option><option value="نعم" ${g.gen=='نعم'?'selected':''}>نعم</option><option value="لا" ${g.gen=='لا'?'selected':''}>لا</option></select>
                </div>
            </div>`).join('');
    }

    function updG(i,f,v) { db[curC].data[curM][curD][i][f] = v; save(); }
    function delG(i) { if(confirm('حذف؟')) { db[curC].data[curM][curD].splice(i,1); save(); }}

    function makeReport() {
        let child = db[curC]; let mData = child.data ? child.data[curM] : null;
        if(!mData) return alert("لا يوجد بيانات.");
        let html = `<div style="text-align:center"><h3>تقرير: ${child.name}</h3><p>شهر: ${curM}</p></div><table border="1" style="width:100%; border-collapse:collapse; font-size:12px;"><tr><th>المجال</th><th>الهدف</th><th>إنجاز</th></tr>`;
        let count = 0;
        for(let d in mData) {
            mData[d].forEach(g => { html += `<tr><td>${d}</td><td>${g.txt}</td><td align="center">${g.prog}%</td></tr>`; count++; });
        }
        if(count === 0) return alert("لا أهداف مضافة.");
        document.getElementById('reportArea').innerHTML = html + `</table><br><button onclick="window.print()" style="width:100%; padding:10px;">🖨️ طباعة</button>`;
        document.getElementById('reportArea').classList.remove('hidden');
    }

    function goP(id) {
        document.querySelectorAll('body > div:not(.status)').forEach(p => p.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }
</script>
</body>
</html>
