<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN - SYSTEM</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --p: #4361ee; --s: #3f37c9; --ok: #2ec4b6; --err: #ef233c; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; direction: rtl; }
        header { background: var(--s); color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .grid-item { background: white; padding: 20px; text-align: center; border-radius: 15px; border: 1px solid #eee; cursor: pointer; border-bottom: 4px solid #ddd; }
        .has-goals { background: #e3f2fd; border-bottom-color: var(--p); font-weight: bold; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; margin-bottom: 10px; box-sizing: border-box; font-size: 14px; }
        .btn { background: var(--p); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        #loginPage { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; background: var(--s); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 0; z-index: 9999; }
        .login-card { background: white; padding: 25px; border-radius: 20px; width: 85%; max-width: 350px; text-align: center; }
        
        @media print {
            .no-print, header, .btn, hr { display: none !important; }
            body { background: white !important; }
            #repDiv { position: static !important; display: block !important; }
        }

        #repDiv { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 10000; overflow-y: auto; display: none; }
        #repDiv.active { display: block; }
    </style>
</head>
<body>

<div id="loginPage">
    <div class="login-card">
        <h2 style="color:var(--s)">مركز I CAN</h2>
        <input type="text" id="uIn" placeholder="اسم المستخدم">
        <input type="password" id="pIn" placeholder="كلمة المرور">
        <button class="btn" onclick="login()">دخول</button>
        <button onclick="document.getElementById('admBox').classList.toggle('hidden')" style="background:none; border:none; color:var(--p); margin-top:20px;">⚙️ الإدارة والسلة</button>
        <div id="admBox" class="hidden">
            <input type="password" id="mKey" oninput="checkAdminKey(this.value)" placeholder="كود الإدارة">
            <div id="secureContent" class="hidden">
                <button class="btn" style="background:var(--err); margin-top:10px" onclick="openBin()">🗑️ فتح السلة</button>
                <hr>
                <input type="text" id="stName" placeholder="اسم الأخصائي">
                <input type="text" id="stPass" placeholder="الباسورد">
                <button class="btn" style="background:var(--ok)" onclick="addStaff()">+ إضافة أخصائي</button>
                <div id="staffListArea" style="margin-top:10px"></div>
            </div>
        </div>
    </div>
</div>

<div id="app" class="hidden">
    <header>
        <div id="backBtn"></div>
        <h3 id="navTitle" style="margin:0">I CAN</h3>
        <button onclick="location.reload()" style="background:none; border:none; color:white; font-size:20px;">🚪</button>
    </header>
    <div class="container" id="mainArea"></div>
</div>

<div id="repDiv"></div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyC4hocSi-1d56msjMoBSGLkxAfV6DRRfcA", databaseURL: "https://ican-center-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const dbRef = firebase.database().ref('IC_DATA_V1');
    const stRef = firebase.database().ref('IC_STAFF_V1');
    const bnRef = firebase.database().ref('IC_BIN_V1');

    let db = {}, staffs = {}, view = 'p1', selC = '', selM = '', selW = '', selD = '', currUser = '';
    const mons = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    const doms = ["تخاطب", "تنمية مهارات", "رعاية ذاتية", "وظيفي", "حركي", "أكاديمي", "اجتماعي", "سلوكي", "نمائي", "حسي"];

    stRef.on('value', s => { staffs = s.val() || {}; updateStaffUI(); });

    function checkAdminKey(v) { 
        if(v === 'رمضان كريم') document.getElementById('secureContent').classList.remove('hidden'); 
        else document.getElementById('secureContent').classList.add('hidden'); 
    }

    function updateStaffUI() {
        let h = '<b style="display:block; margin-bottom:10px;">قائمة الأخصائيين:</b>';
        for(let id in staffs) {
            h += `
                <div class="card" style="display:flex; flex-direction:column; align-items:flex-start; gap:5px;">
                    <div style="width:100%; display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; color:var(--s);">👤 ${staffs[id].u}</span>
                        <button onclick="delStaff('${id}')" style="color:var(--err); border:none; background:none; cursor:pointer; font-size:18px;">🗑️</button>
                    </div>
                    <div style="font-size:13px; color:#666; background:#f0f4ff; padding:4px 8px; border-radius:6px; width:fit-content;">
                        🔑 كلمة المرور: <span style="color:var(--p); font-family:monospace; font-weight:bold;">${staffs[id].p}</span>
                    </div>
                </div>`;
        }
        document.getElementById('staffListArea').innerHTML = h;
    }

    function login() {
        let u = document.getElementById('uIn').value, p = document.getElementById('pIn').value;
        let isStf = Object.values(staffs).find(x=>x.u===u && x.p===p);
        if((u==='hassan' && p==='1234') || isStf) { currUser = u; showApp(); } else alert('خطأ');
    }

    function showApp() { 
        document.getElementById('loginPage').style.display='none'; 
        document.getElementById('app').classList.remove('hidden'); 
        dbRef.on('value', s => { db = s.val() || {}; render(); }); 
    }

    function render() {
        const area = document.getElementById('mainArea'), title = document.getElementById('navTitle'), back = document.getElementById('backBtn');
        area.innerHTML = '';

        if(view === 'p1') {
            title.innerText = "الأطفال"; back.innerHTML = '';
            let h = '<input id="cN" placeholder="اسم الطفل..."><button class="btn" onclick="addC()">+ إضافة طفل</button><hr>';
            for(let n in db) h += `<div class="card" onclick="selC='${n}'; view='p2'; render()"><b>👤 ${n}</b><button onclick="event.stopPropagation(); toBinC('${n}')" style="color:red; border:none; background:none;">🗑️</button></div>`;
            area.innerHTML = h;
        } 
        else if(view === 'p2') {
            title.innerText = selC; back.innerHTML = '<button onclick="view=\'p1\';render()" style="color:white; background:none; border:none;">🔙</button>';
            area.innerHTML = `<div class="grid">${mons.map(m => `<div class="grid-item" onclick="selM='${m}'; view='p3'; render()">${m}</div>`).join('')}</div>`;
        }
        else if(view === 'p3') {
            title.innerText = selM; back.innerHTML = '<button onclick="view=\'p2\';render()" style="color:white; background:none; border:none;">🔙</button>';
            let h = '<div class="grid">';
            [1, 2, 3, 4].forEach(wk => {
                h += `<div class="grid-item" style="border-bottom-color:var(--ok)" onclick="selW='الاسبوع ${wk}'; view='p3_domains'; render()">📅 الأسبوع ${wk}</div>`;
            });
            h += '</div><hr><button class="btn" style="background:var(--p)" onclick="exportMonthlyRep()">📊 طباعة تقرير الشهر الشامل</button>';
            area.innerHTML = h;
        }
        else if(view === 'p3_domains') {
            title.innerText = selW; back.innerHTML = '<button onclick="view=\'p3\';render()" style="color:white; background:none; border:none;">🔙</button>';
            let h = '<div class="grid">';
            doms.forEach(d => {
                let has = db[selC]?.[selM]?.[selW]?.[d];
                h += `<div class="grid-item ${has?'has-goals':''}" onclick="selD='${d}'; view='p4'; render()">${d}</div>`;
            });
            area.innerHTML = h + '</div><button class="btn" style="background:var(--ok); margin-top:10px" onclick="exportWeeklyRep()">📄 طباعة تقرير الأسبوع</button>';
        }
        else if(view === 'p4') {
            title.innerText = selD; back.innerHTML = '<button onclick="view=\'p3_domains\';render()" style="color:white; background:none; border:none;">🔙</button>';
            let gs = db[selC]?.[selM]?.[selW]?.[selD] || {};
            let h = '<input id="gT" placeholder="اسم الهدف..."><button class="btn" onclick="addG()">+ إضافة هدف</button><hr>';
            for(let gn in gs) h += `<div class="card" style="display:block"><b>🎯 ${gn}</b><button onclick="toBinG('${gn}')" style="float:left; color:red; border:none; background:none;">🗑️</button><div style="display:flex; gap:5px; margin-top:5px"><select onchange="upG('${gn}','h',this.value)"><option>المساعدة</option>${["FP","PP","FV","PV","M","G","P","V"].map(o=>`<option value="${o}" ${gs[gn].h==o?'selected':''}>${o}</option>`).join('')}</select><select onchange="upG('${gn}','p',this.value)">${[0,25,50,75,100].map(p=>`<option value="${p}" ${gs[gn].p==p?'selected':''}>${p}%</option>`).join('')}</select><select onchange="upG('${gn}','g',this.value)"><option value="لا" ${gs[gn].g=='لا'?'selected':''}>تعميم: لا</option><option value="نعم" ${gs[gn].g=='نعم'?'selected':''}>نعم</option></select></div></div>`;
            area.innerHTML = h;
        }
        else if(view === 'bin') {
            title.innerText = "سلة المحذوفات"; back.innerHTML = '<button onclick="location.reload()" style="color:white; background:none; border:none;">🔙 خروج</button>';
            bnRef.once('value', s => {
                let b = s.val() || {}, h = '';
                for(let k in b) h += `<div class="card" style="display:block"><b>${k}</b> (${b[k].type=='c'?'طفل':'هدف'})<br><button class="btn" style="width:auto; background:var(--ok)" onclick="restor('${k}')">استرداد</button></div>`;
                area.innerHTML = h || '<center>السلة فارغة</center>';
            });
        }
    }

    function addC() { let n = document.getElementById('cN').value; if(n) dbRef.child(n).update({ exists: true }); }
    function addG() { let t = document.getElementById('gT').value; if(t) dbRef.child(`${selC}/${selM}/${selW}/${selD}/${t}`).set({ h: '', p: 0, g: 'لا' }); }
    function upG(gn, f, v) { dbRef.child(`${selC}/${selM}/${selW}/${selD}/${gn}/${f}`).set(v); }
    function toBinC(n) { if(confirm('حذف الطفل؟')) { bnRef.child(n).set({ type:'c', d: db[n], by: currUser }); dbRef.child(n).remove(); } }
    function toBinG(gn) { let g = db[selC][selM][selW][selD][gn]; bnRef.child(gn).set({ type:'g', d: g, c: selC, m: selM, w: selW, dm: selD, by: currUser }); dbRef.child(`${selC}/${selM}/${selW}/${selD}/${gn}`).remove(); }
    function restor(k) { bnRef.child(k).once('value', s => { let i = s.val(); if(i.type==='c') dbRef.child(k).set(i.d); else dbRef.child(`${i.c}/${i.m}/${i.w}/${i.dm}/${k}`).set(i.d); bnRef.child(k).remove(); }); }
    function addStaff() { let u = document.getElementById('stName').value, p = document.getElementById('stPass').value; if(u && p) stRef.push({ u: u, p: p }); }
    function delStaff(id) { if(confirm('حذف؟')) stRef.child(id).remove(); }
    function openBin() { currUser = "الإدارة"; document.getElementById('loginPage').style.display = 'none'; document.getElementById('app').classList.remove('hidden'); view = 'bin'; render(); }

    function exportWeeklyRep() {
    let data = db[selC][selM][selW];
    if(!data) return alert("لا توجد بيانات");

    let h = `<div id="finalReportView" style="padding:30px; direction:rtl; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
        <div style="border:3px solid var(--s); padding:20px; border-radius:15px; background:white;">
            <h1 style="text-align:center; color:var(--s); margin:0;">مركز I CAN</h1>
            <h3 style="text-align:center; color:#555; border-bottom:2px solid var(--p); padding-bottom:10px;">تقرير متابعة الأسبوع: ${selW}</h3>
            
            <div style="display:flex; justify-content:space-between; margin:20px 0; background:#f8f9fa; padding:15px; border-radius:10px; border-right:5px solid var(--p);">
                <span><b>👤 الطفل:</b> ${selC}</span>
                <span><b>📅 الشهر:</b> ${selM}</span>
            </div>

            <table style="width:100%; border-collapse:collapse; margin-top:10px;" border="1">
                <thead>
                    <tr style="background:var(--s); color:white;">
                        <th style="padding:10px; border:1px solid #ddd;">المجال</th>
                        <th style="padding:10px; border:1px solid #ddd;">الهدف التدريبي</th>
                        <th style="padding:10px; border:1px solid #ddd;">نوع المساعدة</th>
                        <th style="padding:10px; border:1px solid #ddd;">الإنجاز</th>
                        <th style="padding:10px; border:1px solid #ddd;">التعميم</th>
                    </tr>
                </thead>
                <tbody>`;

    for(let d in data) {
        let goals = Object.keys(data[d]);
        goals.forEach((g, index) => {
            let gData = data[d][g];
            h += `<tr>
                ${index === 0 ? `<td rowspan="${goals.length}" style="padding:10px; border:1px solid #ddd; font-weight:bold; background:#eef2ff; color:var(--s); text-align:center;">${d}</td>` : ''}
                <td style="padding:10px; border:1px solid #ddd;">${g}</td>
                <td style="padding:10px; border:1px solid #ddd; text-align:center; color:var(--p); font-weight:bold;">${gData.h || '-'}</td>
                <td style="padding:10px; border:1px solid #ddd; text-align:center; font-weight:bold; color:var(--ok);">${gData.p}%</td>
                <td style="padding:10px; border:1px solid #ddd; text-align:center; font-size:18px;">${gData.g === 'نعم' ? '✅' : '❌'}</td>
            </tr>`;
        });
    }

    h += `</tbody></table>
            <div style="margin-top:30px; display:flex; justify-content:space-between; color:#555;">
                <span>توقيع الأخصائي: ...................</span>
                <span>ختم المركز: ...................</span>
            </div>
        </div>
        <div class="no-print" style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn" style="flex:2" onclick="window.print()">🖨️ طباعة الآن</button>
            <button class="btn" style="background:var(--err); flex:1" onclick="closeReport()">❌ إغلاق</button>
        </div>
    </div>`;

    document.getElementById('repDiv').innerHTML = h;
    document.getElementById('repDiv').classList.add('active');
}
    function exportMonthlyRep() {
    let monthData = db[selC][selM];
    let h = `<div style="padding:30px; direction:rtl; font-family:sans-serif;">
        <div style="border:4px double var(--s); padding:20px; border-radius:15px;">
            <h1 style="text-align:center; color:var(--s); margin-bottom:5px;">مركز I CAN</h1>
            <h2 style="text-align:center; color:var(--ok);">التقرير الشهري الشامل للمتابعة</h2>
            <p style="text-align:center; background:#eee; padding:10px; border-radius:8px;"><b>الطفل:</b> ${selC} | <b>شهر:</b> ${selM}</p>`;

    [1, 2, 3, 4].forEach(num => {
        let wk = "الاسبوع " + num;
        if(monthData[wk]) {
            h += `<h3 style="color:white; background:var(--p); padding:8px 15px; border-radius:5px; margin-top:25px;">🗓️ ${wk}</h3>
                  <table style="width:100%; border-collapse:collapse; margin-bottom:10px;" border="1">
                    <tr style="background:#f1f1f1;">
                        <th width="20%">المجال</th>
                        <th width="40%">الهدف</th>
                        <th width="15%">المساعدة</th>
                        <th width="15%">النسبة</th>
                        <th width="10%">تعميم</th>
                    </tr>`;
            
            for(let d in monthData[wk]) {
                let goals = Object.keys(monthData[wk][d]);
                goals.forEach((g, index) => {
                    let gData = monthData[wk][d][g];
                    h += `<tr>
                        ${index === 0 ? `<td rowspan="${goals.length}" style="padding:8px; border:1px solid #ddd; font-weight:bold; text-align:center; background:#f9faff;">${d}</td>` : ''}
                        <td style="padding:8px; border:1px solid #ddd;">${g}</td>
                        <td style="padding:8px; border:1px solid #ddd; text-align:center;">${gData.h || '-'}</td>
                        <td style="padding:8px; border:1px solid #ddd; text-align:center; font-weight:bold;">${gData.p}%</td>
                        <td style="padding:8px; border:1px solid #ddd; text-align:center;">${gData.g === 'نعم' ? '✅' : '❌'}</td>
                    </tr>`;
                });
            }
            h += `</table>`;
        }
    });

    h += `</div>
        <div class="no-print" style="margin-top:20px; display:flex; gap:10px;">
            <button class="btn" style="flex:2" onclick="window.print()">🖨️ طباعة التقرير الشهري الشامل</button>
            <button class="btn" style="background:var(--err); flex:1" onclick="closeReport()">❌ إغلاق</button>
        </div>
    </div>`;
    document.getElementById('repDiv').innerHTML = h;
    document.getElementById('repDiv').classList.add('active');
}
    function closeReport() { document.getElementById('repDiv').classList.remove('active'); }
</script>
</body>
</html>
