<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN - Live Sync</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #4361ee; --bg: #f8f9fa; }
        body { font-family: sans-serif; background: var(--bg); direction: rtl; margin: 0; padding-bottom: 20px; }
        .header { background: #3f37c9; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .container { padding: 15px; max-width: 500px; margin: 0 auto; }
        .status-bar { padding: 5px; font-size: 12px; text-align: center; background: #eee; margin-bottom: 10px; }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-item { background: white; padding: 15px 5px; text-align: center; border-radius: 10px; border-bottom: 4px solid #ddd; cursor: pointer; font-weight: bold; }
        .btn-item.active { border-bottom-color: var(--primary); background: #eef2ff; }
        .goal-box { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 5px solid var(--primary); }
        .hidden { display: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; margin-bottom: 10px; }
        .back-btn { float: left; background: rgba(0,0,0,0.2); color: white; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        select { padding: 5px; border-radius: 5px; flex: 1; font-size: 11px; }
    </style>
</head>
<body>

<div class="status-bar" id="syncStatus">جاري فحص الاتصال...</div>

<div id="p1">
    <div class="header"><h1>I CAN Center</h1><p>المزامنة السحابية</p></div>
    <div class="container">
        <input type="text" id="cIn" placeholder="اسم الطفل...">
        <button class="btn-main" onclick="addC()">إضافة طفل +</button>
        <div id="cList"></div>
    </div>
</div>

<div id="p2" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p1')">رجوع</span><h2 id="cTitle"></h2></div>
    <div class="container"><div class="grid" id="mGrid"></div></div>
</div>

<div id="p3" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p2')">رجوع</span><h2 id="mTitle"></h2></div>
    <div class="container">
        <div class="grid" id="dGrid"></div>
        <button class="btn-main" style="background:#2ec4b6; margin-top:15px;" onclick="makeReport()">📄 تقرير الشهر</button>
        <div id="reportArea" class="hidden" style="background:white; padding:15px; margin-top:10px; border:1px solid #ccc;"></div>
    </div>
</div>

<div id="p4" class="hidden">
    <div class="header"><span class="back-btn" onclick="goP('p3')">رجوع</span><h2 id="dTitle"></h2></div>
    <div class="container">
        <input type="text" id="gIn" placeholder="اكتب الهدف...">
        <button class="btn-main" onclick="addG()">حفظ الهدف</button>
        <div id="gList"></div>
    </div>
</div>

<script>
    // ********************************************************
    // حط بيانات الـ Firebase هنا بالظبط
    const firebaseConfig = {
        apiKey: "ضع_هنا",
        authDomain: "ضع_هنا",
        databaseURL: "ضع_هنا",
        projectId: "ضع_هنا",
        storageBucket: "ضع_هنا",
        messagingSenderId: "ضع_هنا",
        appId: "ضع_هنا"
    };
    // ********************************************************

    // تشغيل الاتصال
    try {
        firebase.initializeApp(firebaseConfig);
        var dbRef = firebase.database().ref('ican_sync');
        document.getElementById('syncStatus').innerText = "✅ متصل بالسحابة";
    } catch(e) {
        document.getElementById('syncStatus').innerText = "❌ خطأ في الإعدادات";
    }

    let db = [];
    let curC, curM, curD;
    const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    const domains = ["تخاطب", "تنمية مهارات", "رعاية ذاتية", "وظيفي", "حركي", "أكاديمي", "اجتماعي", "سلوكي", "نمائي", "حسي"];

    // استلام البيانات لحظياً
    dbRef.on('value', (snap) => {
        db = snap.val() || [];
        renderC();
        if(curC !== undefined && curM) { renderD(); if(curD) renderG(); }
    }, (err) => {
        document.getElementById('syncStatus').innerText = "❌ عطل في الصلاحيات (الـ Rules)";
    });

    function save() { dbRef.set(db); }

    function addC() {
        let n = document.getElementById('cIn').value;
        if(n) { db.push({name:n, data:{}}); save(); document.getElementById('cIn').value=''; }
    }

    function renderC() {
        document.getElementById('cList').innerHTML = db.map((c,i)=>`
            <div class="card" onclick="openM(${i})"><span>👤 ${c.name}</span><button onclick="event.stopPropagation();delC(${i})" style="color:red;border:none;background:none;">🗑️</button></div>
        `).join('');
    }

    function delC(i){ if(confirm('حذف؟')){ db.splice(i,1); save(); }}

    function openM(i){
        curC=i; document.getElementById('cTitle').innerText=db[i].name;
        document.getElementById('mGrid').innerHTML=months.map(m=>`<div class="btn-item" onclick="openD('${m}')">📅<br>${m}</div>`).join('');
        goP('p2');
    }

    function openD(m){
        curM=m; document.getElementById('mTitle').innerText="شهر "+m;
        document.getElementById('dGrid').innerHTML=domains.map(d=>{
            let active = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][d]);
            return `<div class="btn-item ${active?'active':''}" onclick="openG('${d}')">📁<br>${d}</div>`;
        }).join('');
        goP('p3');
    }

    function openG(d){
        curD=d; document.getElementById('dTitle').innerText=d; renderG(); goP('p4');
    }

    function addG(){
        let txt = document.getElementById('gIn').value;
        if(!txt) return;
        if(!db[curC].data) db[curC].data = {};
        if(!db[curC].data[curM]) db[curC].data[curM] = {};
        if(!db[curC].data[curM][curD]) db[curC].data[curM][curD] = [];
        db[curC].data[curM][curD].push({txt:txt, help:'', prog:'', gen:''});
        save(); document.getElementById('gIn').value='';
    }

    function renderG(){
        let goals = (db[curC].data && db[curC].data[curM] && db[curC].data[curM][curD]) ? db[curC].data[curM][curD] : [];
        document.getElementById('gList').innerHTML = goals.map((g,i)=>`
            <div class="goal-box">
                <b>${g.txt}</b>
                <div style="display:flex; gap:5px; margin-top:10px;">
                    <select onchange="updG(${i},'help',this.value)"><option value="">مساعدة</option>${["FP","PP","FV","PV","M","G","P","V"].map(h=>`<option value="${h}" ${g.help==h?'selected':''}>${h}</option>`).join('')}</select>
                    <select onchange="updG(${i},'prog',this.value)"><option value="">إنجاز</option>${[0,25,50,75,100].map(p=>`<option value="${p}" ${g.prog==p?'selected':''}>${p}%</option>`).join('')}</select>
                    <select onchange="updG(${i},'gen',this.value)"><option value="">تعميم</option><option value="نعم" ${g.gen=='نعم'?'selected':''}>نعم</option><option value="لا" ${g.gen=='لا'?'selected':''}>لا</option></select>
                </div>
            </div>`).join('');
    }

    function updG(i,f,v){ db[curC].data[curM][curD][i][f]=v; save(); }

    function makeReport(){
        let html = `<h3>تقرير ${db[curC].name} - ${curM}</h3><table border="1" style="width:100%; border-collapse:collapse;"><tr><th>المجال</th><th>الهدف</th><th>%</th></tr>`;
        let dData = db[curC].data[curM];
        for(let d in dData){
            dData[d].forEach(g => { html+=`<tr><td>${d}</td><td>${g.txt}</td><td>${g.prog}%</td></tr>`; });
        }
        document.getElementById('reportArea').innerHTML = html + `</table><button onclick="window.print()">طباعة</button>`;
        document.getElementById('reportArea').classList.remove('hidden');
    }

    function goP(id){ document.querySelectorAll('body > div:not(.status-bar)').forEach(p=>p.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
</script>
</body>
</html>
