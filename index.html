<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I CAN - Pro System</title>
    <style>
        :root { --primary: #4361ee; --bg: #f8f9fa; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); margin: 0; direction: rtl; }
        .header { background: linear-gradient(135deg, #3f37c9, #4361ee); color: white; padding: 20px; text-align: center; border-radius: 0 0 25px 25px; }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .grid-box { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 15px; }
        .item-card { background: white; border-radius: 18px; padding: 15px; display: flex; flex-direction: column; align-items: center; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.04); cursor: pointer; border: 2px solid transparent; }
        .has-goals { background: #eef2ff !important; border-color: var(--primary) !important; }
        .list-card { background: white; border-radius: 15px; padding: 18px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; }
        .goal-card { background: white; border-radius: 15px; padding: 15px; margin-bottom: 12px; border-right: 5px solid var(--primary); }
        .select-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
        .custom-select { padding: 8px 4px; border-radius: 10px; border: 1px solid #eee; font-size: 11px; font-weight: bold; outline: none; text-align: center; }
        .input-group { display: flex; background: white; border-radius: 15px; padding: 5px; margin-bottom: 15px; border: 1px solid #eee; }
        input[type="text"] { flex: 1; border: none; padding: 10px; outline: none; }
        .btn-add { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; }
        .hidden { display: none; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 15px; border-radius: 10px; cursor: pointer; float: right; }
    </style>
</head>
<body>
<div id="page-children">
    <div class="header"><h1>مركز I CAN</h1><p>قائمة الأطفال</p></div>
    <div class="container">
        <div class="input-group"><input type="text" id="childInput" placeholder="اسم طفل جديد..."><button class="btn-add" onclick="addChild()">+</button></div>
        <div id="childrenList"></div>
    </div>
</div>
<div id="page-months" class="hidden">
    <div class="header"><button class="back-btn" onclick="showPage('page-children')">رجوع</button><h2 id="childHeaderName"></h2><p>الشهور</p></div>
    <div class="container"><div class="grid-box" id="monthsGrid"></div></div>
</div>
<div id="page-domains" class="hidden">
    <div class="header"><button class="back-btn" onclick="showPage('page-months')">رجوع</button><h2 id="monthHeaderName"></h2><p>المجالات</p></div>
    <div class="container"><div class="grid-box" id="domainsGrid"></div></div>
</div>
<div id="page-goals" class="hidden">
    <div class="header"><button class="back-btn" onclick="showPage('page-domains')">رجوع</button><h2 id="domainHeaderName"></h2><p>الأهداف</p></div>
    <div class="container">
        <div class="input-group"><input type="text" id="goalInput" placeholder="اكتب الهدف..."><input type="date" id="goalDate" style="width:40px;"><button class="btn-add" onclick="addGoal()">+</button></div>
        <div id="goalsList"></div>
    </div>
</div>
<script>
    let db = JSON.parse(localStorage.getItem('ICAN_PRO_V5')) || [];
    let curC, curM, curD;
    const months = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
    const domains = ["تخاطب", "تنمية مهارات", "رعاية ذاتية", "وظيفي", "حركي", "أكاديمي", "اجتماعي", "سلوكي", "تركيز", "إدراك", "قراءة", "كتابة"];
    const helpOptions = ["FP", "PP", "FV", "PV", "M", "G", "P", "V"];
    function save() { localStorage.setItem('ICAN_PRO_V5', JSON.stringify(db)); }
    function addChild() { let v = document.getElementById('childInput').value.trim(); if(v){ db.push({name:v, months:{}}); save(); renderChildren(); document.getElementById('childInput').value=''; }}
    function renderChildren() { document.getElementById('childrenList').innerHTML = db.map((c,i)=>`<div class="list-card" onclick="openMonths(${i})"><span>👤 ${c.name}</span><span onclick="event.stopPropagation();deleteItem('child',${i})" style="color:red">🗑️</span></div>`).join(''); }
    function openMonths(i) { curC=i; document.getElementById('childHeaderName').innerText=db[i].name; document.getElementById('monthsGrid').innerHTML=months.map(m=>`<div class="item-card" onclick="openDomains('${m}')"><i>📅</i><span>${m}</span></div>`).join(''); showPage('page-months'); }
    function openDomains(m) { curM=m; if(!db[curC].months[m]) db[curC].months[m]=domains.map(d=>({name:d, goals:[]})); document.getElementById('monthHeaderName').innerText="شهر "+m; renderDomains(); showPage('page-domains'); }
    function renderDomains() { document.getElementById('domainsGrid').innerHTML=db[curC].months[curM].map((d,di)=>`<div class="item-card ${d.goals.length>0?'has-goals':''}" onclick="openGoals(${di})"><i>📁</i><span>${d.name}</span></div>`).join(''); }
    function openGoals(di) { curD=di; document.getElementById('domainHeaderName').innerText=db[curC].months[curM][di].name; document.getElementById('goalDate').valueAsDate=new Date(); renderGoals(); showPage('page-goals'); }
    function addGoal() { let t=document.getElementById('goalInput').value; let d=document.getElementById('goalDate').value; if(t){ db[curC].months[curM][curD].goals.push({text:t, date:d, help:'', prog:'', gen:''}); save(); renderGoals(); document.getElementById('goalInput').value=''; }}
    function renderGoals() { document.getElementById('goalsList').innerHTML = db[curC].months[curM][curD].goals.map((g,i)=>`<div class="goal-card"><div style="display:flex;justify-content:space-between"><b>${g.text}</b><span onclick="deleteItem('goal',${i})" style="color:red">🗑️</span></div><span style="font-size:10px">📅 ${g.date}</span><div class="select-row">
    <select class="custom-select" onchange="setG(${i},'help',this.value)"><option value="">مساعدة</option>${helpOptions.map(o=>`<option value="${o}" ${g.help==o?'selected':''}>${o}</option>`).join('')}</select>
    <select class="custom-select" onchange="setG(${i},'prog',this.value)"><option value="">إنجاز</option>${['0','25','50','75','100'].map(n=>`<option value="${n}" ${g.prog==n?'selected':''}>${n}%</option>`).join('')}</select>
    <select class="custom-select" onchange="setG(${i},'gen',this.value)"><option value="">تعميم</option><option value="نعم" ${g.gen=='نعم'?'selected':''}>نعم</option><option value="لا" ${g.gen=='لا'?'selected':''}>لا</option></select></div></div>`).join(''); }
    function setG(i,f,v){ db[curC].months[curM][curD].goals[i][f]=v; save(); }
    function deleteItem(t,i){ if(confirm('متأكد؟')){ if(t=='child')db.splice(i,1); else db[curC].months[curM][curD].goals.splice(i,1); save(); t=='child'?renderChildren():renderGoals(); }}
    function showPage(id){ document.querySelectorAll('body > div').forEach(d=>d.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); }
    renderChildren();
</script>
</body>
</html>
